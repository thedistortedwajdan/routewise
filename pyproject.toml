[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routewise"
version = "0.0.1"
description = "Cost-routing gateway for LLM applications: route, cache, and measure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/routewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
